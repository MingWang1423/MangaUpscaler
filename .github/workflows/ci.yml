name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Compile check
        run: python -m compileall -q main.py config_schema.py logging_setup.py errors.py diagnostics.py workspace.py epub gui upscaler
